name: CI (DevContainer Build & Test)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare .env-dev from sample
        run: |

          # 1. Rename the sample file
          cp sample.env-dev .env-dev
          
          # 2. Inject GH secrets
          sed -i "s|{REPLACE_WITH_JWT_SECRET}|${{ secrets.APIKEY_JWT_SECRET }}|g" .env-dev
          sed -i "s|{REPLACE_WITH_COOKIE_SECRET}|${{ secrets.COOKIE_SECRET }}|g" .env-dev
          sed -i "s|{REPLACE_WITH_SYS_PASSWORD}|${{ secrets.SYS_USER_PASS }}|g" .env-dev
          
          # 3. Inject GH variables
          sed -i "s|{REPLACE_WITH_SYS_USERNAME}|${{ vars.SYS_USER_USERNAME }}|g" .env-dev
          sed -i "s|{REPLACE_WITH_TEST_USERNAME}|${{ vars.TEST_USER_USERNAME }}|g" .env-dev

      - name: Build and Run DevContainer Task
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/devcontainer.json
          # Execute commands inside the 'dev_container' service
          runCmd: |

            echo "--- Environment Diagnostics ---"
            bats --version
            npx playwright --version
            
            echo "--- Execution: API Tests (BATS) ---"
            npm run test:api
            
            echo "--- Execution: UI Tests (Playwright) ---"
            npm run test:ui -- --project=chromium
            
            echo "--- Execution: Load Tests (Artillery Smoke) ---"
            npm run test:load:smoke:api

      - name: Upload Playwright Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: .test/
          retention-days: 7