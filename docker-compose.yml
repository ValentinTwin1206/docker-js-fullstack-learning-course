services:
  dev_container:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    container_name: ffs_devcontainer
    env_file:
      - .env-dev
    volumes:
      - .:/workspace:cached
    ports:
      - "9323:9323"
    networks:
      fancy_fileserver:
        ipv4_address: ${DEVCONTAINER_IP:-172.20.0.5}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["dev"]
    command: sleep infinity

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: fancy_fileserver_dev
    env_file:
      - .env-dev
    networks:
      fancy_fileserver:
        ipv4_address: ${SERVER_IP:-172.20.0.10}
    depends_on:
      mongo:
        condition: service_healthy
      redis:        
        condition: service_healthy
    ports:
      - "3000:3000"
    profiles: ["dev"]
    volumes:
      - ./backend:/app/backend:cached

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: fancy_fileserver_frontend_dev
    environment:
      - VITE_BACKEND_URL=http://app:3000
    networks:
      fancy_fileserver:
        ipv4_address: ${FRONTEND_IP:-172.20.0.15}
    depends_on:
      - app
    ports:
      - "5173:5173"
    profiles: ["dev"]
    volumes:
      - ./frontend/src:/app/src

  app_prod:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    container_name: fancy_fileserver_prod
    env_file:
      - .env-prod
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    profiles: ["prod"]
    networks:
      fancy_fileserver:
        ipv4_address: ${SERVER_IP:-172.20.0.10}

  mongo:
    image: jfrog.hub.vwgroup.com/remote-docker-io/mongo:7.0
    container_name: mongodb
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      fancy_fileserver:
        ipv4_address: ${MONGO_IP:-172.20.0.20}

  redis:
    image: jfrog.hub.vwgroup.com/remote-docker-io/redis:7.2
    container_name: redisdb
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      fancy_fileserver:
        ipv4_address: ${REDIS_IP:-172.20.0.30}

networks:
  fancy_fileserver:
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  mongo_data:
  redis_data: