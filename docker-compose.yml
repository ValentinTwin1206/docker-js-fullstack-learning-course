services:
  dev_container:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    container_name: ffs_devcontainer
    env_file:
      - .env-dev
    volumes:
      - .:/workspace:cached
    ports:
      - "9323:9323"
    networks:
      fancy_fileserver:
        ipv4_address: ${DEVCONTAINER_IP:-172.20.0.5}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["dev"]
    command: sleep infinity

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: fancy_fileserver_dev
    env_file:
      - .env-dev
    networks:
      fancy_fileserver:
        ipv4_address: ${SERVER_IP:-172.20.0.10}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    ports:
      - "3000:3000"
    profiles: ["dev"]
    volumes:
      - ./backend:/app/backend:cached

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: fancy_fileserver_frontend_dev
    environment:
      - VITE_BACKEND_URL=http://app:3000
    networks:
      fancy_fileserver:
        ipv4_address: ${FRONTEND_IP:-172.20.0.15}
    depends_on:
      - app
    ports:
      - "5173:5173"
    profiles: ["dev"]
    volumes:
      - ./frontend/src:/app/src

  app_prod:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    container_name: fancy_fileserver_prod
    env_file:
      - .env-prod
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    profiles: ["prod"]
    networks:
      fancy_fileserver:
        ipv4_address: ${SERVER_IP:-172.20.0.10}

  influxdb:
    image: jfrog.hub.vwgroup.com/remote-docker-io/influxdb:2.7
    container_name: influxdb
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_ADMIN_USER:-admin}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD:-admin1234}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG:-fancyfileserver}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET:-api_metrics}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN:-my-super-secret-token}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      fancy_fileserver:
        ipv4_address: ${INFLUXDB_IP:-172.20.0.40}
    ports:
      - "8086:8086"
    profiles: ["dev"]
    volumes:
      - influxdb_data:/var/lib/influxdb2

  grafana:
    image: jfrog.hub.vwgroup.com/remote-docker-io/grafana/grafana:10.4.0
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin1234}
    depends_on:
      influxdb:
        condition: service_healthy
    networks:
      fancy_fileserver:
        ipv4_address: ${GRAFANA_IP:-172.20.0.50}
    ports:
      - "3001:3000"
    profiles: ["dev"]
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

  mongo:
    image: jfrog.hub.vwgroup.com/remote-docker-io/mongo:7.0
    container_name: mongodb
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      fancy_fileserver:
        ipv4_address: ${MONGO_IP:-172.20.0.20}

  redis:
    image: jfrog.hub.vwgroup.com/remote-docker-io/redis:7.2
    container_name: redisdb
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      fancy_fileserver:
        ipv4_address: ${REDIS_IP:-172.20.0.30}

networks:
  fancy_fileserver:
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  mongo_data:
  redis_data:
  influxdb_data:
  grafana_data: